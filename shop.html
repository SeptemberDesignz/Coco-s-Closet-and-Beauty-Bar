<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop | Coco's Closet</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-pink: #EB005B; --brand-pink-light: #FFF0F5; --text-main: #111111; --text-muted: #666666; --bg-color: #FAFAFA; --border: #E8E8E8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope", sans-serif; color: var(--text-main); background: white; line-height: 1.6; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(100% - 2rem, 1400px); margin-inline: auto; }
    
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo-link { font-size: 1.4rem; font-weight: 800; z-index: 1001; }
    .logo-link span { color: var(--brand-pink); }
    .main-nav ul { display: flex; gap: 2rem; list-style: none; }
    .main-nav a { font-size: 0.9rem; font-weight: 600; }
    .main-nav a.active { color: var(--brand-pink); }
    .header-actions { display: flex; align-items: center; gap: 1.2rem; z-index: 1001; }
    .cart-icon { position: relative; }
    .cart-count { position: absolute; top: -8px; right: -10px; background: var(--brand-pink); color: white; font-size: 0.65rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .menu-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .menu-toggle span { display: block; width: 25px; height: 2px; background: var(--text-main); }
    
    .page-header { padding: 8rem 0 3rem; background: var(--bg-color); text-align: center; }
    .page-title { font-size: 2.5rem; font-weight: 800; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; padding: 3rem 0 6rem; }
    .product-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .product-img { width: 100%; aspect-ratio: 4/5; background: var(--bg-color); }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .product-cat { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 0.5rem; }
    .product-name { font-weight: 800; font-size: 1.15rem; margin-bottom: 0.5rem; }
    .product-price { color: var(--brand-pink); font-weight: 800; font-size: 1.15rem; margin-bottom: 1.5rem; }
    .add-to-cart-btn { width: 100%; padding: 0.8rem; background: var(--brand-pink-light); color: var(--brand-pink); border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-align: center; }
    .product-card:hover .add-to-cart-btn { background: var(--brand-pink); color: white; }
    
    @media (max-width: 900px) {
      .menu-toggle { display: flex; }
      .main-nav { position: fixed; top: 0; right: -100%; width: 70%; max-width: 300px; height: 100vh; background: white; padding: 6rem 2rem 2rem; transition: 0.3s; z-index: 1000; }
      .main-nav.active { right: 0; }
      .main-nav ul { flex-direction: column; gap: 1.5rem; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
      .product-info { padding: 1rem 0.5rem; }
      .product-name { font-size: 0.95rem; }
      .product-price { font-size: 1rem; }
      .add-to-cart-btn { padding: 0.6rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo-link" href="index.html">Coco's <span>Closet</span></a>
    <nav class="main-nav" id="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop All</a></li>
        <li><a href="shop.html?cat=women">Women</a></li>
        <li><a href="shop.html?cat=men">Men</a></li>
        <li><a href="shop.html?cat=beauty">Beauty</a></li>
        <li><a href="shop.html?cat=accessories">Accessories</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </a>
      <div class="menu-toggle" onclick="document.getElementById('main-nav').classList.toggle('active')">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
</header>

<div class="page-header">
  <h1 class="page-title" id="page-title">All Products</h1>
</div>

<main class="container">
  <div class="product-grid" id="shop-grid"></div>
</main>

<script>
  const products = [
    { id: "p1", name: "Classic Everyday Handbag", price: 25000, category: "Accessories", image: "images/product-01.jpg" },
    { id: "p2", name: "Satin Slip Dress", price: 38000, category: "Women's Fashion", image: "images/product-02.jpg" },
    { id: "p3", name: "Men's Linen Shirt", price: 32000, category: "Men's Fashion", image: "images/product-03.jpg" },
    { id: "p4", name: "Hydrating Glow Serum", price: 18000, category: "Skincare", image: "images/product-04.jpg" },
    { id: "p5", name: "Matte Lip Set", price: 12000, category: "Beauty & Cosmetics", image: "images/product-05.jpg" },
    { id: "p6", name: "Soft Cotton Tee", price: 9500, category: "Men's Fashion", image: "images/product-06.jpg" }
  ];

  const params = new URLSearchParams(window.location.search);
  const categoryFilter = params.get('cat');
  let filteredProducts = products;
  
  if (categoryFilter) {
    if (categoryFilter === 'women') { filteredProducts = products.filter(p => p.category === "Women's Fashion"); document.getElementById('page-title').textContent = "Women's Fashion"; }
    else if (categoryFilter === 'men') { filteredProducts = products.filter(p => p.category === "Men's Fashion"); document.getElementById('page-title').textContent = "Men's Fashion"; }
    else if (categoryFilter === 'beauty') { filteredProducts = products.filter(p => p.category === "Skincare" || p.category === "Beauty & Cosmetics"); document.getElementById('page-title').textContent = "Beauty & Skincare"; }
    else if (categoryFilter === 'accessories') { filteredProducts = products.filter(p => p.category === "Accessories"); document.getElementById('page-title').textContent = "Accessories"; }
  }

  const grid = document.getElementById('shop-grid');
  filteredProducts.forEach(product => {
    const card = document.createElement('article');
    card.className = 'product-card';
    card.innerHTML = `
      <a href="product.html?id=${product.id}" class="product-img">
        <img src="${product.image}" onerror="this.src='https://placehold.co/600x800/FFF0F5/EB005B?text=Image'">
      </a>
      <div class="product-info">
        <span class="product-cat">${product.category}</span>
        <a href="product.html?id=${product.id}" class="product-name">${product.name}</a>
        <span class="product-price">MK ${product.price.toLocaleString()}</span>
        <a href="product.html?id=${product.id}" class="add-to-cart-btn">View Details</a>
      </div>
    `;
    grid.appendChild(card);
  });

  let cart = JSON.parse(localStorage.getItem('coco_cart')) || [];
  if (cart.length > 0) {
    document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.quantity, 0);
    document.getElementById('cart-count').hidden = false;
  }
</script>
</body>
</html>
