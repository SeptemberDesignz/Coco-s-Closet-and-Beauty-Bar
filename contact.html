<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Coco's Closet</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-pink: #EB005B; --bg-color: #FAFAFA; --border: #E8E8E8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope", sans-serif; line-height: 1.6; background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
    .card { background: white; padding: 4rem 3rem; border-radius: 32px; max-width: 500px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.05); text-align: center; }
    h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
    p { margin-bottom: 2rem; color: #666; }
    .card h2 { margin-bottom: 2rem; color: var(--brand-pink); font-size: 1.2rem; text-transform: uppercase; }
    .contact-links { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .contact-links a { display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 1.2rem; background: var(--bg-color); border-radius: 16px; color: #111; font-weight: 700; text-decoration: none; transition: 0.3s; }
    .contact-links a:hover { background: #FFF0F5; color: var(--brand-pink); }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 1.3rem; background: var(--brand-pink); color: white; text-decoration: none; border-radius: 99px; font-weight: 800; }
    .nav-link { color: #666; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Get in Touch</h1>
    <p>We'd love to hear from you. Order via WhatsApp or follow us.</p>
    <h2>Coco's Closet and Beauty Bar</h2>
    <div class="contact-links">
      <a href="tel:+265880335011">📞 +265 880 335 011</a>
      <a href="https://www.instagram.com/shoppingwithcoco/" target="_blank">📸 Instagram @shoppingwithcoco</a>
      <a href="https://www.facebook.com/shoppingwithcoco/" target="_blank">👍 Facebook @shoppingwithcoco</a>
    </div>
    <a href="https://wa.me/265880335011" target="_blank" class="btn">Message Us on WhatsApp</a>
    <a href="index.html" class="nav-link">← Back to Home</a>
  </div>
</body>
</html>
