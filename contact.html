<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Coco's Closet and Beauty Bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-pink: #EB005B; --brand-pink-dark: #C4004B; --brand-pink-light: #FFF0F5; --text-main: #111111; --text-muted: #666666; --bg-color: #FAFAFA; --border: #E8E8E8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope", sans-serif; color: var(--text-main); line-height: 1.6; background: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
    .card { background: white; padding: 4rem 3rem; border-radius: 32px; max-width: 500px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.05); text-align: center; }
    h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; letter-spacing: -0.03em; }
    p { margin-bottom: 2rem; color: var(--text-muted); font-size: 1.1rem; }
    .card h2 { margin-bottom: 2rem; color: var(--brand-pink); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.1em; }
    
    .contact-links { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
    .contact-links a { display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 1.2rem; background: var(--bg-color); border-radius: 16px; color: var(--text-main); font-weight: 700; text-decoration: none; transition: 0.3s; }
    .contact-links a:hover { background: var(--brand-pink-light); color: var(--brand-pink); transform: translateY(-3px); box-shadow: 0 8px 16px rgba(235, 0, 91, 0.1); }
    
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 1.3rem; background: var(--brand-pink); color: white; text-decoration: none; border-radius: 99px; font-weight: 800; font-size: 1.1rem; border: none; cursor: pointer; transition: 0.3s; }
    .btn:hover { background: var(--brand-pink-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(235, 0, 91, 0.2); }
    .nav-link { color: var(--text-muted); font-weight: 600; text-decoration: none; display: inline-block; margin-top: 2rem; font-size: 0.9rem; }
    .nav-link:hover { color: var(--brand-pink); }
  </style>
</head>
<body>
